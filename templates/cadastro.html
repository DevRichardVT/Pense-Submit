{% extends "base.html" %}

{% block titulo %}Cadastro de Usuário - PEnsE-Submite{% endblock %}

{% block conteudo %}
<div class="barra-voltar barra-voltar--estreito">
  <a class="botao-voltar" href="{{ url_for('auth.login') }}">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Voltar para o login
  </a>
</div>

<section class="formulario formulario--estreito">
  <h1 class="formulario__titulo">Criar Conta</h1>

  <form method="POST" action="{{ url_for('auth.cadastro') }}" enctype="multipart/form-data">
    <div class="campo">
      <label for="nome">Nome Completo:</label>
      <div class="campo__entrada">
        <input type="text" id="nome" name="nome" maxlength="100" placeholder="Digite seu nome completo" required>
      </div>
    </div>

    <div class="campo">
      <label for="email">E-mail:</label>
      <div class="campo__entrada">
        <input type="email" id="email" name="email" maxlength="100" placeholder="Digite seu e-mail" required>
      </div>
    </div>

    <div class="campo">
      <label for="senha">Senha (máx. 20 caracteres):</label>
      <div class="campo__entrada">
        <input type="password" id="senha" name="senha" maxlength="20" placeholder="Crie uma senha de até 20 caracteres" required>
      </div>
    </div>

    <div class="arquivo">
      <label for="foto" class="botao-arquivo">
        Adicionar foto de perfil (opcional)
      </label>
      <input
        type="file"
        id="foto"
        name="foto"
        accept=".jpg,.jpeg,.png,.webp,.gif,image/*"
      >
      <div class="cadastro-preview">
        <img id="preview-foto" class="card__avatar" src="{{ url_for('static', filename='img/gato1.jpg') }}" alt="Pré-visualização do avatar">
        <span id="nome-foto">Nenhuma foto selecionada (usará avatar padrão)</span>
      </div>
    </div>

    <div class="formulario__acoes">
      <button type="submit" class="botao botao--principal">CADASTRAR</button>
    </div>
  </form>

  <p class="formulario__link-auxiliar">
    Já tem conta? <a href="{{ url_for('auth.login') }}">Faça login</a>
  </p>
</section>

<script>
  const inputFoto = document.getElementById("foto");
  const nomeFoto = document.getElementById("nome-foto");
  const previewFoto = document.getElementById("preview-foto");

  if (inputFoto) {
    inputFoto.addEventListener("change", function () {
      if (inputFoto.files && inputFoto.files.length > 0) {
        const file = inputFoto.files[0];
        nomeFoto.textContent = file.name;
        const reader = new FileReader();
        reader.onload = function (e) {
          if (e.target && e.target.result) {
            previewFoto.src = e.target.result;
          }
        };
        reader.readAsDataURL(file);
      } else {
        nomeFoto.textContent = "Nenhuma foto selecionada (usará avatar padrão)";
      }
    });
  }
</script>
{% endblock %}
