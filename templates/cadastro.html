{% extends "base.html" %}

{% block titulo %}Cadastro de Usuário - PEnsE-Submite{% endblock %}

{% block conteudo %}
<section class="formulario formulario--estreito">
  <h1 class="formulario__titulo">Criar Conta</h1>

  <form method="POST" action="{{ url_for('auth.cadastro') }}">
    <div class="campo">
      <label for="nome">Nome Completo:</label>
      <div class="campo__entrada">
        <input type="text" id="nome" name="nome" maxlength="100" placeholder="Digite seu nome completo" required>
      </div>
    </div>

    <div class="campo">
      <label for="email">E-mail:</label>
      <div class="campo__entrada">
        <input type="email" id="email" name="email" maxlength="100" placeholder="Digite seu e-mail" required>
      </div>
    </div>

    <div class="campo">
      <label for="senha">Senha (máx. 20 caracteres):</label>
      <div class="campo__entrada">
        <input type="password" id="senha" name="senha" maxlength="20" placeholder="Crie uma senha de até 20 caracteres" required>
      </div>
    </div>

    <div class="formulario__acoes">
      <button type="submit" class="botao botao--principal">CADASTRAR</button>
    </div>
  </form>

  <p class="formulario__link-auxiliar">
    Já tem conta? <a href="{{ url_for('auth.login') }}">Faça login</a>
  </p>
</section>
{% endblock %}
