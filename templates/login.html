{% extends "base.html" %}

{% block titulo %}Login - PEnsE-Submite{% endblock %}

{% block conteudo %}
<section class="formulario formulario--estreito">
  <h1 class="formulario__titulo">Acesso ao Sistema</h1>

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="campo">
      <label for="email">E-mail:</label>
      <div class="campo__entrada">
        <input type="email" id="email" name="email" maxlength="100" placeholder="Digite seu e-mail" required>
      </div>
    </div>

    <div class="campo">
      <label for="senha">Senha:</label>
      <div class="campo__entrada">
        <input type="password" id="senha" name="senha" maxlength="20" placeholder="Digite sua senha" required>
      </div>
    </div>

    <div class="formulario__acoes">
      <button type="submit" class="botao botao--principal">ENTRAR</button>
    </div>
  </form>

  <p class="formulario__link-auxiliar">
    Ainda não possui conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se aqui</a>
  </p>
</section>
{% endblock %}
